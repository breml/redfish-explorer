---

name: Go Matrix

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  cross:
    name: Go ${{ matrix.go-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.go-version == 'tip' }}
    env:
      CGO_ENABLED: 0
      GO: ${{ matrix.go-version == 'tip' && 'gotip' || 'go' }}

    strategy:
      fail-fast: false
      matrix:
        go-version: [ "stable", "tip" ]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version == 'tip' && 'stable' || matrix.go-version }}
          cache: true

      - name: Install Go tip
        if: matrix.go-version == 'tip'
        shell: bash
        run: |
          go install golang.org/dl/gotip@latest
          gotip download

      - name: Test
        shell: bash
        run: $GO test -v -cover ./...

      - name: Build
        shell: bash
        run: $GO build -ldflags "-s -w" -trimpath ./...
